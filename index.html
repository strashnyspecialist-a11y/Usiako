<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<title>Пост з Websklad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --paper:#fff; --ink:#14171C; --muted:#5B6672; --line:#D3D9E0;
  --brand:#2440E6; --ok:#0F7A55; --ok-bg:#DDF3E9; --warn:#8A5300; --warn-bg:#FFF1CF; --bad:#B3261E; --bad-bg:#FCE4E1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.top{background:var(--ink);color:#fff;padding:14px 16px 12px}
.top h1{font-size:18px;font-weight:700;letter-spacing:.01em}
.top .feed{margin-top:2px;font-size:13px;color:#B9C1CB}
.top .feed b{color:#fff;font-weight:600}

.sec{background:var(--paper);padding:16px;margin-top:8px}
.sec>h2{font-size:15px;font-weight:700;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:15px}

/* article tag */
.tag{display:flex;align-items:stretch;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.tag span{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:0 12px;display:flex;align-items:center}
.tag input{flex:1;min-width:0;border:0;padding:14px 12px;font-size:26px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;background:transparent}
.tag input:focus-visible{outline:none}
.tag:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,64,230,.25)}
.tag input::placeholder{color:#B3BBC5;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-weight:700;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.block{display:flex;width:100%}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mt{margin-top:12px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:#EEF1F4}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.prod h2{font-size:19px;line-height:1.3;font-weight:700}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.code{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.price{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;margin-top:12px}
.price div{padding:10px 12px}
.price div+div{border-left:1.5px solid var(--line)}
.price small{display:block;font-size:12px;color:var(--muted)}
.price b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.price .mine b{color:var(--brand)}
.alert{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:8px;overflow:hidden;background:#EEF1F4;cursor:pointer;outline-offset:2px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:0;border-radius:8px;border:2px solid transparent}
.ph.on::after{border-color:var(--brand);background:rgba(36,64,230,.12)}
.ph i{position:absolute;top:4px;right:4px;min-width:22px;height:22px;border-radius:11px;background:var(--brand);color:#fff;font:700 12px/22px Onest,sans-serif;text-align:center;font-style:normal;padding:0 4px}
.ph.nojpg::before{content:"не JPEG";position:absolute;left:4px;bottom:4px;z-index:1;background:var(--warn-bg);color:var(--warn);font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px}

textarea{width:100%;min-height:260px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;line-height:1.45;resize:vertical}
textarea:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,64,230,.2)}
.counter{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.counter.over{color:var(--bad);font-weight:700}

.list button{display:block;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.list button:first-child{border-top:0}
.list b{font-variant-numeric:tabular-nums}

label.f{display:block;margin-top:12px;font-size:14px;font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-weight:400;background:#fff;min-height:46px}
label.f textarea{min-height:90px}
label.f input:focus-visible,label.f select:focus-visible,label.f textarea:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,64,230,.2)}
label.f small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px}
label.chk input{width:22px;height:22px;flex:none;margin:1px 0 0}
.bar{height:8px;border-radius:4px;background:#E3E7EC;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--brand)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .wrap{display:grid;grid-template-columns:1fr 1fr}
nav.tabs button{border:0;background:none;min-height:60px;font-weight:600;font-size:15px;color:var(--muted);border-top:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--brand)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;display:none}
.toast.show{display:block}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.done{background:var(--ok-bg);color:var(--ok);padding:12px;border-radius:10px;font-weight:600;margin-top:12px}
.done a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <h1>Пост з Websklad</h1>
  <div class="feed" id="feedStatus">Завантаження…</div>
</div></header>

<main class="wrap">
  <div id="viewPost">
    <section class="sec">
      <div class="tag"><span>арт.</span><input id="q" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ws78472" aria-label="Артикул товару"></div>
      <button class="btn primary block mt" id="btnFind">Знайти товар</button>
      <p class="hint mt">Можна ввести артикул із «ws» або без, а також частину назви.</p>
    </section>
    <div id="result"></div>
  </div>

  <div id="viewSettings" hidden>
    <section class="sec">
      <h2>Фід товарів</h2>
      <p class="hint" id="feedInfo"></p>
      <label class="btn block mt" style="cursor:pointer">Вибрати файл фіду (.xml)
        <input type="file" id="feedFile" accept=".xml,text/xml,application/xml" hidden>
      </label>
      <div class="bar" id="feedBar" hidden><i></i></div>
      <p class="hint mt" id="feedProg"></p>
    </section>

    <section class="sec">
      <h2>Ціна в пості</h2>
      <div id="fPrice"></div>
    </section>

    <section class="sec">
      <h2>Підпис (Gemini)</h2>
      <div id="fGemini"></div>
      <button class="btn small mt" id="btnTestGemini">Перевірити ключ</button>
    </section>

    <section class="sec">
      <h2>Instagram</h2>
      <div id="fIg"></div>
      <button class="btn small mt" id="btnTestIg">Перевірити підключення</button>
    </section>

    <section class="sec">
      <h2>Ризикові бренди</h2>
      <div id="fStop"></div>
    </section>
    <p class="hint" style="padding:12px 16px">Ключі й токен зберігаються тільки в цьому браузері. Не відкривайте застосунок на чужих пристроях.</p>
  </div>
</main>

<nav class="tabs" aria-label="Розділи"><div class="wrap">
  <button id="tabPost" aria-selected="true">Пост</button>
  <button id="tabSettings" aria-selected="false">Налаштування</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

// <PARSER>
const ENT={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' ',ensp:' ',emsp:' ',ndash:'–',mdash:'—',Mdash:'—',laquo:'«',raquo:'»',hellip:'…',deg:'°',times:'×',bull:'•',rsquo:'’',lsquo:'‘',ldquo:'“',rdquo:'”',copy:'©',reg:'®',trade:'™',frac12:'½',frac14:'¼',plusmn:'±',asymp:'≈',ge:'≥',le:'≤',Omega:'Ω',Phi:'Φ',Pi:'Π',Oslash:'Ø',auml:'ä',euml:'ë',brvbar:'¦',Prime:'″',lrm:'',rlm:'',shy:'',lbsp:'',middot:'·',middo:'·',ordm:'º',mu:'μ',micro:'µ',sup2:'²',sup3:'³',phi:'φ',minus:'−'};
function decodeEntities(s){
  return s.replace(/&(#x[0-9a-f]+|#\d+|[a-z0-9]+);/gi,(m,e)=>{
    if(e[0]==='#'){
      const n=e[1].toLowerCase()==='x'?parseInt(e.slice(2),16):parseInt(e.slice(1),10);
      try{return String.fromCodePoint(n)}catch{return ''}
    }
    return ENT[e]!==undefined?ENT[e]:m;
  });
}
function stripHtml(h){
  return decodeEntities(h.replace(/<!\[CDATA\[|\]\]>/g,'')
    .replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|h[1-6]|ul|ol|tr)>/gi,'\n')
    .replace(/<li[^>]*>/gi,'• ').replace(/<\/li>/gi,'\n').replace(/<[^>]+>/g,''));
}
function htmlToText(h){
  if(!h)return '';
  let t=stripHtml(h);
  if(/<\/?[a-z]|&[a-z#0-9]+;/i.test(t))t=stripHtml(t); // подвійне кодування в деяких описах
  return t.replace(/[ \t\u00a0]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function tag(x,t){const m=x.match(new RegExp('<'+t+'>([\\s\\S]*?)</'+t+'>'));return m?m[1]:''}
function parseOffer(x){
  const head=(x.match(/<offer\s+([^>]*)>/)||[])[1]||'';
  const id=(head.match(/\bid="([^"]*)"/)||[])[1]||'';
  const txt=t=>decodeEntities(tag(x,t).replace(/<!\[CDATA\[|\]\]>/g,'')).trim();
  const num=t=>{const v=parseFloat(tag(x,t));return isFinite(v)?v:0};
  const pics=[...x.matchAll(/<picture>([\s\S]*?)<\/picture>/g)].map(m=>decodeEntities(m[1].trim())).filter(Boolean);
  const params=[];
  for(const m of x.matchAll(/<param name="([^"]*)">([\s\S]*?)<\/param>/g)){
    const k=decodeEntities(m[1]).trim(), v=decodeEntities(m[2]).trim();
    if(k&&v&&!/^(Состояние|Стан|Производитель|Виробник)$/i.test(k))params.push([k,v.slice(0,120)]);
    if(params.length>=14)break;
  }
  const descUa=htmlToText(tag(x,'description_ua')), descRu=htmlToText(tag(x,'description'));
  return {
    key:txt('vendorCode').toLowerCase(), code:txt('vendorCode'), id,
    name:txt('name'), nameUa:txt('name_ua'), desc:(descUa||descRu).slice(0,2200),
    pics, price:num('price'), drp:num('drp'), qty:num('quantity_in_stock'),
    inStock:/available="true"/.test(head)||txt('stock_status')==='instock',
    brand:txt('brand'), cat:txt('category_ua')||txt('category'), sub:txt('sub_category_ua')||txt('sub_category'),
    url:txt('url'), country:txt('country_of_origin'), params
  };
}
async function parseFeed(file,onOffer,onProgress){
  const reader=file.stream().getReader(), dec=new TextDecoder('utf-8');
  let buf='',bytes=0,n=0;
  for(;;){
    const {value,done}=await reader.read();
    if(done)buf+=dec.decode(); else {bytes+=value.length;buf+=dec.decode(value,{stream:true});}
    let p=0;
    for(;;){
      const s=buf.indexOf('<offer ',p);
      if(s<0){p=Math.max(p,buf.length-16);break}
      const e=buf.indexOf('</offer>',s);
      if(e<0){p=s;break}
      const o=parseOffer(buf.slice(s,e+8));
      p=e+8;
      if(o.code){await onOffer(o);n++}
    }
    buf=buf.slice(p);
    if(onProgress)onProgress(bytes/(file.size||1),n);
    if(done)break;
  }
  return n;
}
// </PARSER>

// ---------- storage (IndexedDB with in-memory fallback) ----------
const DB={db:null,ok:false,kv:new Map(),offers:[]};
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const txDone=tx=>new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});
async function dbOpen(){
  try{
    if(!window.indexedDB)throw 0;
    DB.db=await new Promise((res,rej)=>{
      const r=indexedDB.open('ws-insta',1);
      r.onupgradeneeded=()=>{r.result.createObjectStore('offers',{keyPath:'key'});r.result.createObjectStore('kv')};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    });
    DB.ok=true;
  }catch{DB.ok=false}
}
async function kvGet(k){if(!DB.ok)return DB.kv.get(k);try{return await rq(DB.db.transaction('kv').objectStore('kv').get(k))}catch{return DB.kv.get(k)}}
async function kvSet(k,v){DB.kv.set(k,v);if(!DB.ok)return;try{const tx=DB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);await txDone(tx)}catch{}}
async function offersClear(){DB.offers=[];if(!DB.ok)return;const tx=DB.db.transaction('offers','readwrite');tx.objectStore('offers').clear();await txDone(tx)}
async function offersPut(arr){DB.offers.push(...arr);if(!DB.ok)return;const tx=DB.db.transaction('offers','readwrite');const st=tx.objectStore('offers');arr.forEach(o=>st.put(o));await txDone(tx)}
async function offersAll(){if(!DB.ok)return DB.offers;try{return await rq(DB.db.transaction('offers').objectStore('offers').getAll())}catch{return DB.offers}}

// ---------- state ----------
const DEF={
  markupPct:0,markupFixed:0,round:5,base:'price',showPrice:true,
  geminiKey:'',model:'gemini-3.5-flash',tags:8,cta:'📩 Замовлення — в Direct',extra:'',
  igId:'',igToken:'',host:'https://graph.facebook.com',ver:'v23.0',
  stop:"victoria's secret, nike, adidas, puma, gucci, louis vuitton, chanel, dior, prada, versace, rolex, apple, samsung, jbl, dyson, lego"
};
const S={settings:{...DEF},offers:[],byCode:new Map(),meta:null,cur:null};

function setOffers(rows){S.offers=rows;S.byCode=new Map(rows.map(o=>[o.key,o]))}

// ---------- pure helpers ----------
function finalPrice(o,s=S.settings){
  const base=s.base==='drp'?o.drp:o.price;
  let p=base*(1+(+s.markupPct||0)/100)+(+s.markupFixed||0);
  const st=+s.round||0;
  p=st>0?Math.ceil(p/st-1e-9)*st:Math.round(p);
  return p;
}
function riskHits(o,s=S.settings){
  const hay=(o.brand+' '+o.name+' '+o.nameUa).toLowerCase();
  return s.stop.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).filter(w=>{
    const re=new RegExp('(^|[^a-zа-яіїєґ0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-zа-яіїєґ0-9])','i');
    return re.test(hay);
  });
}
function findProducts(q){
  q=q.trim();
  if(!q)return {exact:null,list:[]};
  const norm=q.toLowerCase().replace(/\s+/g,'');
  const digits=/^\d+$/.test(norm);
  const hit=S.byCode.get(digits?'ws'+norm:norm);
  if(hit)return {exact:hit,list:[]};
  if(digits){const byId=S.offers.find(o=>o.id===norm);if(byId)return {exact:byId,list:[],viaId:true}}
  const words=q.toLowerCase().split(/\s+/);
  const list=S.offers.filter(o=>{const h=(o.name+' '+o.nameUa+' '+o.code).toLowerCase();return words.every(w=>h.includes(w))}).slice(0,8);
  return {exact:null,list};
}
function isJpeg(u){return /\.jpe?g($|\?)/i.test(u)}
function composeCaption(o,text,hashtags,s=S.settings){
  let out=text.trim();
  if(s.showPrice)out+=`\n\n💰 Ціна: ${fmt(finalPrice(o,s))} грн`;
  if(s.cta)out+=(s.showPrice?'\n':'\n\n')+s.cta.trim();
  const tags=(hashtags||[]).map(t=>'#'+String(t).replace(/^#+/,'').replace(/\s+/g,'')).filter(t=>t.length>1).slice(0,+s.tags||0);
  if(tags.length)out+='\n\n'+tags.join(' ');
  return out;
}

// ---------- UI helpers ----------
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}
function setTab(name){
  $('#viewPost').hidden=name!=='post';$('#viewSettings').hidden=name!=='settings';
  $('#tabPost').setAttribute('aria-selected',name==='post');$('#tabSettings').setAttribute('aria-selected',name==='settings');
  window.scrollTo(0,0);
}
$('#tabPost').onclick=()=>setTab('post');$('#tabSettings').onclick=()=>setTab('settings');

function renderStatus(){
  const m=S.meta,n=S.offers.length;
  if(!n){$('#feedStatus').innerHTML='Фід не завантажено. Додайте файл у налаштуваннях.';$('#feedInfo').textContent='Файл ще не завантажено.';return}
  const d=m?.at?new Date(m.at).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  const inS=S.offers.filter(o=>o.inStock).length;
  $('#feedStatus').innerHTML=`<b>${fmt(n)}</b> товарів, у наявності <b>${fmt(inS)}</b>${d?' · оновлено '+d:''}`;
  $('#feedInfo').textContent=`Завантажено ${fmt(n)} товарів${m?.name?' з файлу '+m.name:''}${d?', '+d:''}.${DB.ok?'':' Сховище недоступне: після закриття сторінки файл доведеться завантажити знову.'}`;
}

// ---------- search & product view ----------
async function doFind(){
  const q=$('#q').value;
  if(!S.offers.length){toast('Спочатку завантажте фід у налаштуваннях');setTab('settings');return}
  const r=findProducts(q);
  if(r.exact)return openProduct(r.exact,r.viaId);
  S.cur={type:r.list.length?'list':'none',list:r.list,q};
  renderResult();
}
function openProduct(o,viaId){
  const sel=[];for(let i=0;i<o.pics.length&&sel.length<10;i++)sel.push(i);
  S.cur={type:'rec',rec:o,sel,all:false,caption:'',busy:false,confirm:false,ack:false,pub:null,viaId};
  renderResult();
  $('#result').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderResult(){
  const P=S.cur,box=$('#result');
  if(!P){box.innerHTML='';return}
  if(P.type==='none'){box.innerHTML=`<section class="sec"><p class="empty">Нічого не знайдено за «${esc(P.q)}». Перевірте артикул: він має вигляд ws78472.</p></section>`;return}
  if(P.type==='list'){
    box.innerHTML=`<section class="sec"><h2>Схожі товари</h2><div class="list">${P.list.map((o,i)=>`<button data-act="choose" data-i="${i}"><b>${esc(o.code)}</b> · ${esc(o.nameUa||o.name)}<div class="hint">${o.inStock?'є в наявності':'немає в наявності'} · ${fmt(o.price)} грн</div></button>`).join('')}</div></section>`;
    return;
  }
  box.innerHTML='<section class="sec prod" id="sProd"></section><section class="sec" id="sPhotos"></section><section class="sec" id="sCap"></section><section class="sec" id="sPub"></section>';
  renderProd();renderPhotos();renderCap();renderPub();
}
function renderProd(){
  const o=S.cur.rec,risk=riskHits(o),price=finalPrice(o);
  const gain=price-o.drp;
  $('#sProd').innerHTML=`
    <h2>${esc(o.nameUa||o.name)}</h2>
    <div class="meta"><span class="code">${esc(o.code)}</span> · ${esc(o.cat)}${o.sub?' / '+esc(o.sub):''}${o.brand&&o.brand!=='Без бренда'?' · '+esc(o.brand):''}</div>
    <div class="pills">
      <span class="pill ${o.inStock?'ok':'bad'}">${o.inStock?'В наявності'+(o.qty?': '+o.qty+' шт':''):'Немає в наявності'}</span>
      ${S.cur.viaId?'<span class="pill warn">знайдено за id, не за артикулом</span>':''}
    </div>
    <div class="price">
      <div><small>Ціна у фіді (price)</small><b>${fmt(o.price)} ₴</b><small>закупка (drp): ${fmt(o.drp)} ₴</small></div>
      <div class="mine"><small>Ціна в пості</small><b>${fmt(price)} ₴</b><small>різниця з drp: ${gain>=0?'+':''}${fmt(gain)} ₴</small></div>
    </div>
    ${!o.inStock?'<div class="alert bad">Товару немає в наявності. Публікувати його не варто.</div>':''}
    ${risk.length?`<div class="alert warn">Можливий ризик для акаунта: збіг із «${esc(risk.join(', '))}». Перевірте, що це оригінал, а не копія.</div>`:''}
    ${!o.pics.length?'<div class="alert bad">У фіді немає фото для цього товару.</div>':''}`;
}
function renderPhotos(){
  const P=S.cur,o=P.rec;
  if(!o.pics.length){$('#sPhotos').innerHTML='<h2>Фото</h2><p class="empty">Немає фото.</p>';return}
  const shown=P.all?o.pics.length:Math.min(o.pics.length,16);
  const nonJ=P.sel.filter(i=>!isJpeg(o.pics[i])).length;
  let h='<h2>Фото для посту</h2><div class="grid">';
  for(let i=0;i<shown;i++){
    const pos=P.sel.indexOf(i);
    h+=`<button class="ph ${pos>=0?'on':''} ${isJpeg(o.pics[i])?'':'nojpg'}" data-act="pick" data-i="${i}" aria-pressed="${pos>=0}" aria-label="Фото ${i+1}"><img src="${esc(o.pics[i])}" loading="lazy" referrerpolicy="no-referrer" alt="">${pos>=0?`<i>${pos+1}</i>`:''}</button>`;
  }
  h+='</div>';
  if(o.pics.length>shown)h+=`<button class="btn small mt" data-act="allpics">Показати всі (${o.pics.length})</button>`;
  h+=`<p class="hint mt">Обрано ${P.sel.length} з 10. Перше фото стане обкладинкою. Номер на фото показує порядок.</p>`;
  if(nonJ)h+=`<div class="alert warn">${nonJ} фото не у форматі JPEG. Instagram API приймає тільки JPEG, такі фото краще прибрати.</div>`;
  $('#sPhotos').innerHTML=h;
}
function renderCap(){
  const P=S.cur;
  const hasKey=!!S.settings.geminiKey;
  let h='<h2>Підпис українською</h2>';
  if(!P.caption&&!P.busy){
    h+=hasKey?'<button class="btn primary block" data-act="gen">Написати підпис</button>':'<p class="empty">Щоб писати підписи, додайте ключ Gemini в налаштуваннях.</p><button class="btn block mt" data-act="toSettings">Відкрити налаштування</button>';
  }else if(P.busy){
    h+='<button class="btn block" disabled><span class="spin"></span> Gemini пише…</button>';
  }else{
    h+=`<textarea id="cap" aria-label="Підпис до посту">${esc(P.caption)}</textarea><div class="counter" id="capCount"></div>
    <div class="row mt"><button class="btn small" data-act="copy">Копіювати</button><button class="btn small" data-act="gen">Написати заново</button></div>`;
  }
  if(P.err)h+=`<div class="alert bad">${esc(P.err)}</div>`;
  $('#sCap').innerHTML=h;
  updateCount();
}
function updateCount(){
  const c=$('#capCount');if(!c)return;
  const n=[...S.cur.caption].length;
  c.textContent=`${n} / 2200`;c.classList.toggle('over',n>2200);
  renderPub();
}
function renderPub(){
  const P=S.cur,el=$('#sPub');if(!el)return;
  const o=P.rec,s=S.settings;
  const warns=[];
  if(!o.inStock)warns.push('товару немає в наявності');
  if(riskHits(o).length)warns.push('ризиковий бренд');
  const n=[...P.caption].length;
  const noCreds=!s.igId||!s.igToken;
  const ready=P.caption&&n<=2200&&P.sel.length>0&&!noCreds&&!P.busy&&!P.pubBusy;
  let h='<h2>Публікація</h2>';
  if(P.pub&&P.pub.done){
    h+=`<div class="done">Опубліковано.${P.pub.link?` <a href="${esc(P.pub.link)}" target="_blank" rel="noopener">Відкрити пост</a>`:''}</div>`;
  }else{
    if(noCreds)h+='<p class="hint">Додайте ID акаунта й токен Instagram в налаштуваннях.</p>';
    else if(!P.caption)h+='<p class="hint">Спочатку напишіть підпис.</p>';
    if(P.confirm&&ready){
      h+=`<p class="hint">Буде опубліковано ${P.sel.length>1?'карусель із '+P.sel.length+' фото':'1 фото'} в акаунті. Це побачать підписники.</p>`;
      if(warns.length)h+=`<label class="chk"><input type="checkbox" id="ack" ${P.ack?'checked':''}> Розумію, що ${esc(warns.join(' і '))}, і все одно публікую</label>`;
      h+=`<button class="btn primary block mt" data-act="pubgo" ${warns.length&&!P.ack?'disabled':''}>Так, опублікувати</button><button class="btn block mt" data-act="pubcancel">Скасувати</button>`;
    }else if(P.pubBusy){
      h+=`<button class="btn block" disabled><span class="spin"></span> ${esc(P.pubMsg||'Публікую…')}</button>`;
    }else{
      h+=`<button class="btn primary block" data-act="pubstart" ${ready?'':'disabled'}>Опублікувати в Instagram</button>`;
    }
    if(P.pub&&P.pub.err)h+=`<div class="alert bad">${esc(P.pub.err)}</div>`;
  }
  el.innerHTML=h;
}

// ---------- Gemini ----------
async function genCaption(){
  const P=S.cur,o=P.rec,s=S.settings;
  P.busy=true;P.err='';renderCap();renderPub();
  try{
    const sys=`Ти — копірайтер інтернет-магазину. Пишеш підписи до постів в Instagram українською мовою.
Правила:
- Використовуй лише факти з наданих даних. Нічого не вигадуй: розміри, потужність, матеріали, гарантію, сертифікати.
- Не обіцяй лікувальних чи медичних ефектів, не використовуй слова «лікує», «зцілює» тощо.
- Не вказуй ціну, контакти й посилання: їх додасть застосунок.
- Структура: 1) заголовок із 1 емодзі; 2) 1–2 речення про те, кому й навіщо потрібен товар; 3) 3–5 рядків із ключовими характеристиками, кожен із емодзі на початку; 4) за потреби комплектація одним рядком.
- Тон: дружній і живий, без крику й суцільних великих літер. Поле text не довше 700 символів.
- Переклади російські терміни з даних українською.
- hashtags: ${+s.tags||8} релевантних хештегів українською та англійською, без назв чужих брендів, без пробілів.
Відповідай ТІЛЬКИ JSON без додаткового тексту: {"text":"...","hashtags":["#..."]}.${s.extra?'\nДодаткові вимоги власника магазину: '+s.extra:''}`;
    const data={
      назва:o.nameUa||o.name,категорія:[o.cat,o.sub].filter(Boolean).join(' / '),
      бренд:o.brand&&o.brand!=='Без бренда'?o.brand:'',країна:o.country,
      характеристики:o.params.map(([k,v])=>k+': '+v),опис:o.desc.slice(0,1800)
    };
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(s.model||'gemini-3.5-flash')}:generateContent`;
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.geminiKey},body:JSON.stringify({
      systemInstruction:{parts:[{text:sys}]},
      contents:[{role:'user',parts:[{text:JSON.stringify(data)}]}],
      generationConfig:{responseMimeType:'application/json',temperature:0.8}
    })});
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(j.error?.message||('Gemini: HTTP '+res.status));
    const parts=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought&&p.text).map(p=>p.text);
    if(!parts.length)throw new Error('Gemini не повернув текст. Спробуйте ще раз.');
    const raw=parts.join('').trim().replace(/^```(?:json)?\s*|\s*```$/g,'');
    let out;try{out=JSON.parse(raw)}catch{out={text:raw,hashtags:[]}}
    P.caption=composeCaption(o,String(out.text||raw),Array.isArray(out.hashtags)?out.hashtags:[]);
  }catch(e){P.err=e.message||String(e)}
  P.busy=false;renderCap();renderPub();
}

// ---------- Instagram ----------
async function graph(path,{method='GET',params={}}={}){
  const s=S.settings;
  const url=`${s.host.replace(/\/$/,'')}/${s.ver}/${path}`;
  const body=new URLSearchParams();
  for(const [k,v] of Object.entries({...params,access_token:s.igToken}))body.append(k,String(v));
  const res=method==='GET'?await fetch(url+'?'+body):await fetch(url,{method:'POST',body});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.error)throw new Error(j.error?.message||('Instagram: HTTP '+res.status));
  return j;
}
async function waitReady(id){
  for(let i=0;i<30;i++){
    const j=await graph(id,{params:{fields:'status_code'}});
    if(j.status_code==='FINISHED')return;
    if(j.status_code==='ERROR'||j.status_code==='EXPIRED')throw new Error('Instagram не зміг обробити фото (статус '+j.status_code+'). Перевірте, що фото у форматі JPEG.');
    await new Promise(r=>setTimeout(r,2000));
  }
  throw new Error('Instagram довго обробляє фото. Спробуйте ще раз пізніше.');
}
async function publish(){
  const P=S.cur,s=S.settings;
  const urls=P.sel.map(i=>P.rec.pics[i]),cap=$('#cap').value;
  P.pubBusy=true;P.confirm=false;P.pub=null;
  const say=m=>{P.pubMsg=m;renderPub()};
  try{
    let creation;
    if(urls.length===1){
      say('Створюю пост…');
      creation=(await graph(`${s.igId}/media`,{method:'POST',params:{image_url:urls[0],caption:cap}})).id;
    }else{
      const kids=[];
      for(let i=0;i<urls.length;i++){
        say(`Завантажую фото ${i+1} з ${urls.length}…`);
        const c=(await graph(`${s.igId}/media`,{method:'POST',params:{image_url:urls[i],is_carousel_item:'true'}})).id;
        await waitReady(c);kids.push(c);
      }
      say('Збираю карусель…');
      creation=(await graph(`${s.igId}/media`,{method:'POST',params:{media_type:'CAROUSEL',children:kids.join(','),caption:cap}})).id;
    }
    say('Instagram обробляє пост…');
    await waitReady(creation);
    say('Публікую…');
    const pub=await graph(`${s.igId}/media_publish`,{method:'POST',params:{creation_id:creation}});
    const info=await graph(pub.id,{params:{fields:'permalink'}}).catch(()=>({}));
    P.pub={done:true,link:info.permalink||''};
  }catch(e){P.pub={err:e.message||String(e)}}
  P.pubBusy=false;renderPub();
}

// ---------- events ----------
$('#btnFind').onclick=doFind;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doFind()});
$('#result').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const P=S.cur,a=b.dataset.act;
  if(a==='choose')openProduct(P.list[+b.dataset.i]);
  else if(a==='pick'){
    const i=+b.dataset.i,at=P.sel.indexOf(i);
    if(at>=0)P.sel.splice(at,1);else if(P.sel.length>=10)return toast('Максимум 10 фото в каруселі');else P.sel.push(i);
    renderPhotos();renderPub();
  }
  else if(a==='allpics'){P.all=true;renderPhotos()}
  else if(a==='gen')genCaption();
  else if(a==='toSettings')setTab('settings');
  else if(a==='copy'){
    const t=$('#cap').value;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const c=$('#cap');c.select();document.execCommand('copy')}).then(()=>toast('Підпис скопійовано'));
  }
  else if(a==='pubstart'){P.confirm=true;P.ack=false;renderPub()}
  else if(a==='pubcancel'){P.confirm=false;renderPub()}
  else if(a==='pubgo')publish();
});
$('#result').addEventListener('input',e=>{if(e.target.id==='cap'){S.cur.caption=e.target.value;updateCount()}});
$('#result').addEventListener('change',e=>{if(e.target.id==='ack'){S.cur.ack=e.target.checked;renderPub()}});

// ---------- settings ----------
function fld(k,label,{type='text',hint='',ph='',opts=null,rows=0}={}){
  const v=S.settings[k];
  if(opts)return `<label class="f">${label}<select data-k="${k}">${opts.map(([val,t])=>`<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select>${hint?`<small>${hint}</small>`:''}</label>`;
  if(rows)return `<label class="f">${label}<textarea data-k="${k}" placeholder="${esc(ph)}">${esc(v)}</textarea>${hint?`<small>${hint}</small>`:''}</label>`;
  return `<label class="f">${label}<input data-k="${k}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}" autocomplete="off" ${type==='number'?'inputmode="decimal" step="any"':''}>${hint?`<small>${hint}</small>`:''}</label>`;
}
function renderSettings(){
  $('#fPrice').innerHTML=
    fld('base','Від чого рахувати',{opts:[['price','Ціна у фіді (price)'],['drp','Дроп-ціна (drp)']]})+
    `<div class="two">${fld('markupPct','Націнка, %',{type:'number'})}${fld('markupFixed','Плюс, грн',{type:'number'})}</div>`+
    fld('round','Округлювати вгору до',{opts:[[0,'Без округлення'],[5,'5 грн'],[10,'10 грн'],[50,'50 грн']]})+
    `<label class="chk"><input type="checkbox" data-k="showPrice" ${S.settings.showPrice?'checked':''}> Додавати ціну в підпис</label>`;
  $('#fGemini').innerHTML=
    fld('geminiKey','Ключ Gemini API',{type:'password',hint:'Отримати: aistudio.google.com → Get API key'})+
    fld('model','Модель')+
    fld('tags','Кількість хештегів',{type:'number'})+
    fld('cta','Рядок після ціни',{ph:'📩 Замовлення — в Direct'})+
    fld('extra','Додаткові вказівки для стилю',{rows:1,ph:'Наприклад: звертайся на «ви», менше емодзі'});
  $('#fIg').innerHTML=
    fld('igId','ID Instagram-акаунта',{hint:'Instagram Business/Creator, прив’язаний до Facebook-сторінки'})+
    fld('igToken','Токен доступу',{type:'password',hint:'Потрібен дозвіл на публікацію контенту. Токен доведеться періодично поновлювати.'})+
    `<div class="two">${fld('ver','Версія API')}${fld('host','Адреса API')}</div>`;
  $('#fStop').innerHTML=fld('stop','Слова через кому',{rows:1,hint:'Якщо бренд або назва товару містить одне з них, з’явиться попередження перед публікацією.'});
}
$('#viewSettings').addEventListener('change',async e=>{
  const k=e.target.dataset.k;if(!k)return;
  let v=e.target.type==='checkbox'?e.target.checked:e.target.value.trim();
  if(['markupPct','markupFixed','tags'].includes(k))v=parseFloat(v)||0;
  if(k==='round')v=parseInt(v,10)||0;
  S.settings[k]=v;
  await kvSet('settings',S.settings);
  toast('Збережено');
  if(S.cur&&S.cur.type==='rec'){renderProd();renderPub();renderCap()}
});
$('#feedFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const bar=$('#feedBar'),fill=bar.firstElementChild,prog=$('#feedProg');
  bar.hidden=false;fill.style.width='0';prog.textContent='Читаю файл…';
  try{
    await offersClear();
    const all=[];let batch=[],last=0;
    const n=await parseFeed(f,async o=>{
      all.push(o);batch.push(o);
      if(batch.length>=400){const b=batch;batch=[];await offersPut(b)}
    },(pr,cnt)=>{fill.style.width=Math.round(pr*100)+'%';prog.textContent=`Розібрано товарів: ${fmt(cnt)}`});
    if(batch.length)await offersPut(batch);
    if(!n)throw new Error('У файлі не знайдено товарів. Потрібен YML-файл Websklad.');
    setOffers(all);
    S.meta={at:Date.now(),name:f.name,count:n};
    await kvSet('meta',S.meta);
    prog.textContent=`Готово: ${fmt(n)} товарів.`;
    S.cur=null;renderResult();renderStatus();
    toast('Фід оновлено');
  }catch(err){prog.textContent='Помилка: '+(err.message||err)}
  e.target.value='';
});
$('#btnTestGemini').onclick=async()=>{
  const s=S.settings;if(!s.geminiKey)return toast('Спочатку введіть ключ');
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(s.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.geminiKey},body:JSON.stringify({contents:[{parts:[{text:'Відповідай одним словом: працює'}]}]})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error?.message||'HTTP '+r.status);
    toast('Gemini працює');
  }catch(e){toast('Помилка: '+(e.message||e))}
};
$('#btnTestIg').onclick=async()=>{
  const s=S.settings;if(!s.igId||!s.igToken)return toast('Введіть ID і токен');
  try{const j=await graph(s.igId,{params:{fields:'username'}});toast('Підключено: @'+(j.username||s.igId))}
  catch(e){toast('Помилка: '+(e.message||e))}
};

// ---------- init ----------
(async function(){
  await dbOpen();
  S.settings={...DEF,...((await kvGet('settings'))||{})};
  setOffers(await offersAll());
  S.meta=(await kvGet('meta'))||null;
  renderSettings();renderStatus();
  if(!S.offers.length)setTab('settings');
})();
</script>
